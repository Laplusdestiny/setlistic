<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ホーム（曲一覧）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Klee+One:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2747A0}a:hover{color:#1A3478}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F2EA; color: #1E1C18; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 56px 20px 12px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1E1C18" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1.5"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
      <span style="font-size: 22px; font-weight: 700; letter-spacing: 0.02em">Setlistic</span>
    </div>
    <button aria-label="並び替え" style="width: 44px; height: 44px; border: 1px solid #D9D2C3; background: #FFFDF8; border-radius: 12px; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1C18" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 4v16M4 17l3 3 3-3M17 20V4M14 7l3-3 3 3"></path></svg>
    </button>
  </header>

  <div style="padding: 4px 20px 12px">
    <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden">曲を検索</label>
    <div style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px; background: #FFFDF8; border: 1px solid #D9D2C3; border-radius: 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5A52" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="q" placeholder="曲名・アーティスト・タグで検索" style="border: 0; background: transparent; font: inherit; font-size: 15px; flex: 1; outline: none; color: #1E1C18">
    </div>
  </div>

  <div style="display: flex; gap: 8px; padding: 0 20px 14px; overflow-x: auto">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
      <button style="flex: none; height: 36px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 500; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}" onClick="{{c.pick}}">{{c.label}}</button>
    </sc-for>
  </div>

  <div style="flex: 1; margin: 0 16px; background: #FFFDF8; border: 1px solid #D9D2C3; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px 10px; border-bottom: 1px dashed #CFC7B6">
      <span style="font-family: 'Klee One', 'Zen Kaku Gothic New', cursive; font-size: 18px">SET LIST</span>
      <span style="font-size: 12px; color: #5E5A52">{{count}}曲 ・ 最近追加順</span>
    </div>
    <sc-for list="{{songs}}" as="s" hint-placeholder-count="5">
      <a href="Detail.dc.html" style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-bottom: 1px solid #ECE6DA; text-decoration: none; color: #1E1C18">
        <span style="font-family: 'Klee One', cursive; font-size: 20px; width: 26px; color: #2747A0; padding-top: 2px">{{s.no}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 16px; font-weight: 700">{{s.title}}</span>
          <span style="font-size: 13px; color: #5E5A52">{{s.artist}}</span>
          <span style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px">
            <sc-for list="{{s.tags}}" as="t" hint-placeholder-count="2">
              <span style="font-size: 11px; padding: 2px 8px; border-radius: 6px; background: #E6EAF5; color: #23397A">#{{t}}</span>
            </sc-for>
          </span>
        </span>
        <span style="font-size: 12px; color: #5E5A52; border: 1px solid #D9D2C3; border-radius: 6px; padding: 2px 6px; flex: none">キー {{s.key}}</span>
      </a>
    </sc-for>
  </div>

  <nav aria-label="メインメニュー" style="display: flex; justify-content: space-around; align-items: center; padding: 10px 12px 30px; margin-top: 12px; background: #FFFDF8; border-top: 1px solid #D9D2C3">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; min-height: 44px; font-size: 11px; color: #2747A0; text-decoration: none; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1.5"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>セトリ</a>
    <a href="Search.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; min-height: 44px; font-size: 11px; color: #5E5A52; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>検索</a>
    <a href="AddUrl.dc.html" aria-label="曲を登録" style="width: 56px; height: 56px; border-radius: 18px; background: #2747A0; display: flex; align-items: center; justify-content: center; margin-top: -24px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="Tags.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 44px; font-size: 11px; color: #5E5A52; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="8.5" r="1.3"></circle></svg>タグ</a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 44px; font-size: 11px; color: #5E5A52; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { picked: 'すべて' }; }
  renderVals() {
    const labels = ['すべて','十八番','練習中','アニソン','盛り上げ','バラード'];
    const chips = labels.map((l) => {
      const on = this.state.picked === l;
      return { label: l, bg: on ? '#1E1C18' : '#FFFDF8', fg: on ? '#FFFFFF' : '#1E1C18', border: on ? '#1E1C18' : '#D9D2C3', pick: () => this.setState({ picked: l }) };
    });
    const all = [
      { title: '夜に駆ける', artist: 'YOASOBI', tags: ['十八番','盛り上げ'], key: '-2' },
      { title: '残酷な天使のテーゼ', artist: '高橋洋子', tags: ['アニソン','盛り上げ'], key: '±0' },
      { title: 'マリーゴールド', artist: 'あいみょん', tags: ['十八番','バラード'], key: '+1' },
      { title: '白日', artist: 'King Gnu', tags: ['練習中'], key: '-3' },
      { title: 'Lemon', artist: '米津玄師', tags: ['バラード'], key: '±0' }
    ];
    const p = this.state.picked;
    const list = p === 'すべて' ? all : all.filter((s) => s.tags.indexOf(p) >= 0);
    const songs = list.map((s, i) => ({ ...s, no: String(i + 1).padStart(2, '0') }));
    return { chips, songs, count: songs.length };
  }
}
</script>
</body>
</html>
