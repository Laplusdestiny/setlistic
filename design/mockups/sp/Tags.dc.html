<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>タグ管理・タグから探す</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Klee+One:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2747A0}a:hover{color:#1A3478}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F2EA; color: #1E1C18; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 56px 20px 8px; display: flex; align-items: center; gap: 8px">
    <a href="Main.dc.html" aria-label="戻る" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -10px; color: #1E1C18">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700; flex: 1">タグ</h1>
    <button style="height: 40px; padding: 0 14px; border: 0; border-radius: 12px; background: #1E1C18; color: #FFFFFF; font-size: 13px">＋ 新規</button>
  </header>

  <div style="padding: 4px 20px 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #E9E3D6; border-radius: 12px; padding: 4px; gap: 4px">
      <button style="height: 40px; border: 0; border-radius: 9px; font-size: 14px; background: {{exploreBg}}; color: {{exploreFg}}; font-weight: 700" onClick="{{toExplore}}">タグから探す</button>
      <button style="height: 40px; border: 0; border-radius: 9px; font-size: 14px; background: {{manageBg}}; color: {{manageFg}}; font-weight: 700" onClick="{{toManage}}">管理</button>
    </div>
    <label for="tq" style="position: absolute; width: 1px; height: 1px; overflow: hidden">タグを検索</label>
    <input id="tq" placeholder="タグ名で検索" style="height: 46px; padding: 0 14px; background: #FFFDF8; border: 1px solid #D9D2C3; border-radius: 14px; font-size: 15px; color: #1E1C18">
  </div>

  <sc-if value="{{explore}}" hint-placeholder-val="{{ true }}">
    <div style="flex: 1; overflow-y: auto; padding: 0 20px 24px; display: flex; flex-direction: column; gap: 18px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <section style="display: flex; flex-direction: column; gap: 10px">
          <h2 style="margin: 0; font-size: 13px; font-weight: 700; color: #5E5A52">{{g.name}}</h2>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{g.tags}}" as="t" hint-placeholder-count="4">
              <a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px 0 14px; border-radius: 999px; border: 1px solid #D9D2C3; background: #FFFDF8; color: #1E1C18; text-decoration: none; font-size: 14px">#{{t.label}}<span style="font-size: 12px; color: #5E5A52; background: #F0EBE0; border-radius: 999px; padding: 1px 8px">{{t.count}}</span></a>
            </sc-for>
          </div>
        </section>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{manage}}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; overflow-y: auto; padding: 0 20px 24px; display: flex; flex-direction: column; gap: 18px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <section style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <h2 style="margin: 0; font-size: 13px; font-weight: 700; color: #5E5A52">{{g.name}}</h2>
            <button style="height: 32px; border: 0; background: transparent; font-size: 12px; color: #2747A0">グループ名を変更</button>
          </div>
          <div style="display: flex; flex-direction: column; background: #FFFDF8; border: 1px solid #D9D2C3; border-radius: 14px; overflow: hidden">
            <sc-for list="{{g.tags}}" as="t" hint-placeholder-count="3">
              <div style="display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 6px 0 10px; border-bottom: 1px solid #ECE6DA">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A99F8B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"></path></svg>
                <span style="flex: 1; font-size: 15px">#{{t.label}}</span>
                <span style="font-size: 12px; color: #5E5A52">{{t.count}}曲</span>
                <button aria-label="編集" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E1C18" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
              </div>
            </sc-for>
          </div>
        </section>
      </sc-for>
      <p style="margin: 0; font-size: 12px; color: #5E5A52; line-height: 1.7">ドラッグで並べ替え・グループ移動。タグを削除しても曲は消えません。</p>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { mode: 'explore' }; }
  renderVals() {
    const ex = this.state.mode === 'explore';
    const t = (label, count) => ({ label, count });
    return {
      explore: ex, manage: !ex,
      exploreBg: ex ? '#FFFDF8' : 'transparent', exploreFg: ex ? '#1E1C18' : '#5E5A52',
      manageBg: ex ? 'transparent' : '#FFFDF8', manageFg: ex ? '#5E5A52' : '#1E1C18',
      toExplore: () => this.setState({ mode: 'explore' }), toManage: () => this.setState({ mode: 'manage' }),
      groups: [
        { name: '歌える度', tags: [t('十八番', 12), t('歌える', 41), t('練習中', 9)] },
        { name: 'ジャンル', tags: [t('J-POP', 38), t('アニソン', 17), t('ボカロ', 8), t('ロック', 11)] },
        { name: 'マイタグ', tags: [t('高音つらい', 6), t('フル尺長い', 3), t('原キーOK', 14)] }
      ]
    };
  }
}
</script>
</body>
</html>
