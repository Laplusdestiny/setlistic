<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>曲詳細・編集</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Klee+One:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2747A0}a:hover{color:#1A3478}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F2EA; color: #1E1C18; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 56px 20px 8px; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="戻る" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -10px; color: #1E1C18">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <button style="height: 44px; padding: 0 14px; border: 1px solid #D9D2C3; border-radius: 12px; background: #FFFDF8; font-size: 14px; font-weight: 500; color: #1E1C18">編集</button>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 4px">
      <span style="font-family: 'Klee One', cursive; font-size: 15px; color: #2747A0; padding: 4px 12px; border: 1.5px solid #2747A0; border-radius: 999px; transform: rotate(-3deg)">SET LIST No.01</span>
      <h1 style="margin: 6px 0 0; font-size: 28px; font-weight: 700; text-align: center">夜に駆ける</h1>
      <p style="margin: 0; font-size: 15px; color: #5E5A52">YOASOBI</p>
      <div style="display: flex; gap: 6px; flex-wrap: wrap; justify-content: center">
        <span style="font-size: 12px; padding: 4px 10px; border-radius: 8px; background: #E6EAF5; color: #23397A">#十八番</span>
        <span style="font-size: 12px; padding: 4px 10px; border-radius: 8px; background: #E6EAF5; color: #23397A">#J-POP</span>
        <span style="font-size: 12px; padding: 4px 10px; border-radius: 8px; background: #E6EAF5; color: #23397A">#盛り上げ</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 6px; background: #FFFDF8; border: 1px solid #D9D2C3; border-radius: 12px">
        <span style="font-size: 11px; color: #5E5A52">キー</span><span style="font-family: 'Klee One', cursive; font-size: 22px">-2</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 6px; background: #FFFDF8; border: 1px solid #D9D2C3; border-radius: 12px">
        <span style="font-size: 11px; color: #5E5A52">最高点</span><span style="font-family: 'Klee One', cursive; font-size: 22px">[点数]</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 6px; background: #FFFDF8; border: 1px solid #D9D2C3; border-radius: 12px">
        <span style="font-size: 11px; color: #5E5A52">最後に歌った日</span><span style="font-family: 'Klee One', cursive; font-size: 18px; padding-top: 3px">[日付]</span></div>
    </div>

    <section style="display: flex; flex-direction: column; gap: 8px; padding: 14px; background: #FFFDF8; border: 1px solid #D9D2C3; border-radius: 14px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 700">メモ</h2>
      <p style="margin: 0; font-size: 14px; line-height: 1.7">サビ前で息継ぎ。2番Aメロは走りがちなので注意。</p>
    </section>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <button style="height: 50px; border: 0; border-radius: 14px; background: #2747A0; color: #FFFFFF; font-size: 15px; font-weight: 700">今日歌った！を記録</button>
      <a href="#" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 14px; border: 1px solid #D9D2C3; background: #FFFDF8; color: #1E1C18; font-size: 14px; text-decoration: none">Apple Musicで開く</a>
    </div>

    <button style="height: 44px; border: 0; background: transparent; color: #A3341C; font-size: 14px">この曲を削除</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
