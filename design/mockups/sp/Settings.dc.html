<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>設定</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Klee+One:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2747A0}a:hover{color:#1A3478}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F2EA; color: #1E1C18; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 56px 20px 8px; display: flex; align-items: center; gap: 8px">
    <a href="Main.dc.html" aria-label="戻る" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -10px; color: #1E1C18">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700">設定</h1>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 4px 20px 32px; display: flex; flex-direction: column; gap: 18px">
    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="4">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 4px; font-size: 12px; font-weight: 700; color: #5E5A52; letter-spacing: 0.04em">{{sec.name}}</h2>
        <div style="display: flex; flex-direction: column; background: #FFFDF8; border: 1px solid #D9D2C3; border-radius: 14px; overflow: hidden">
          <sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="2">
            <a href="{{r.href}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 14px; border-bottom: 1px solid #ECE6DA; text-decoration: none; color: #1E1C18">
              <span style="font-size: 15px">{{r.label}}</span>
              <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5E5A52">{{r.value}}
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px">
      <button style="height: 50px; border: 1px solid #D9D2C3; border-radius: 14px; background: #FFFDF8; font-size: 15px; color: #1E1C18">ログアウト</button>
      <button style="height: 44px; border: 0; background: transparent; font-size: 14px; color: #A3341C">アカウントを削除</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { sections: [
      { name: 'アカウント', rows: [
        { label: 'メールアドレス', value: '[メールアドレス]', href: '#' },
        { label: 'ログイン方法', value: 'Google', href: '#' } ] },
      { name: '曲の登録', rows: [
        { label: 'カスタム項目', value: '3項目', href: '#' },
        { label: '登録時に付けるタグ', value: '#歌える', href: '#' },
        { label: 'タグの管理', value: '', href: 'Tags.dc.html' } ] },
      { name: '表示', rows: [
        { label: 'テーマ', value: '端末に合わせる', href: '#' },
        { label: '一覧の並び順', value: '最近追加した順', href: '#' },
        { label: '一覧に表示する項目', value: 'キー・タグ', href: '#' } ] },
      { name: 'データ', rows: [
        { label: 'エクスポート（CSV / JSON）', value: '', href: '#' },
        { label: 'インポート', value: '', href: '#' } ] },
      { name: '共有（今後）', rows: [
        { label: '友だちを招待', value: '準備中', href: '#' } ] }
    ] };
  }
}
</script>
</body>
</html>
