<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PC タグ管理</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Klee+One:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2747A0}a:hover{color:#1A3478}
button,input,select{font-family:inherit}
</style>
</helmet>
<div style="min-height: 900px; background: #F5F2EA; color: #1E1C18; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif; display: flex; flex-wrap: wrap">

  <nav aria-label="メインメニュー" style="flex: 1 1 200px; max-width: 240px; box-sizing: border-box; padding: 28px 16px; border-right: 1px solid #D9D2C3; background: #FFFDF8; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 10px 22px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E1C18" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1.5"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
      <span style="font-size: 20px; font-weight: 700">Setlistic</span>
    </div>
    <a href="Home.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 10px; color: #1E1C18; text-decoration: none; font-size: 14px">セトリ（曲一覧）</a>
    <a href="Tags.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 10px; background: #E6EAF5; color: #23397A; font-weight: 700; text-decoration: none; font-size: 14px">タグ管理</a>
    <a href="Settings.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 10px; color: #1E1C18; text-decoration: none; font-size: 14px">設定</a>
    <a href="Add.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 46px; margin-top: 16px; border-radius: 12px; background: #2747A0; color: #FFFFFF; font-weight: 700; text-decoration: none; font-size: 14px">＋ 曲を登録</a>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700; flex: 1 1 auto">タグ管理</h1>
      <label for="tsq" style="position: absolute; width: 1px; height: 1px; overflow: hidden">タグを検索</label>
      <input id="tsq" placeholder="タグ名で検索" style="flex: 0 1 300px; min-width: 180px; height: 44px; padding: 0 14px; border: 1px solid #D9D2C3; border-radius: 12px; background: #FFFDF8; font-size: 14px; color: #1E1C18">
      <button style="height: 44px; padding: 0 16px; border: 1px solid #D9D2C3; border-radius: 12px; background: #FFFDF8; font-size: 14px; color: #1E1C18">＋ グループ</button>
      <button style="height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: #1E1C18; color: #FFFFFF; font-size: 14px">＋ タグ</button>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
          <section style="background: #FFFDF8; border: 1px solid #D9D2C3; border-radius: 14px; overflow: hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px dashed #CFC7B6">
              <h2 style="margin: 0; font-size: 14px; font-weight: 700">{{g.name}}</h2>
              <span style="font-size: 12px; color: #5E5A52">{{g.kind}}</span>
            </div>
            <sc-for list="{{g.tags}}" as="t" hint-placeholder-count="3">
              <button style="display: flex; width: 100%; align-items: center; gap: 10px; min-height: 46px; padding: 0 16px 0 10px; border: 0; border-bottom: 1px solid #ECE6DA; background: {{t.bg}}; text-align: left; color: #1E1C18" onClick="{{t.pick}}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A99F8B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"></path></svg>
                <span style="flex: 1; font-size: 14px; font-weight: {{t.weight}}">#{{t.label}}</span>
                <span style="font-size: 12px; color: #5E5A52">{{t.count}}曲</span>
              </button>
            </sc-for>
          </section>
        </sc-for>
      </div>

      <aside aria-label="タグの編集" style="flex: 1 1 360px; min-width: 0; box-sizing: border-box; padding: 22px; background: #FFFDF8; border: 1px solid #D9D2C3; border-radius: 16px; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-size: 18px; font-weight: 700">#{{cur.label}} を編集</h2>
        <div style="display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center">
          <label for="tn" style="font-size: 13px; color: #5E5A52">タグ名</label>
          <input id="tn" value="{{cur.label}}" style="height: 42px; padding: 0 12px; border: 1px solid #D9D2C3; border-radius: 10px; background: #FFFFFF; font-size: 14px; color: #1E1C18">
          <label for="tg" style="font-size: 13px; color: #5E5A52">グループ</label>
          <select id="tg" style="height: 42px; padding: 0 10px; border: 1px solid #D9D2C3; border-radius: 10px; background: #FFFFFF; font-size: 14px; color: #1E1C18">
            <option>{{cur.group}}</option><option>マイタグ</option>
          </select>
          <span style="font-size: 13px; color: #5E5A52">別名</span>
          <span style="font-size: 13px; color: #5E5A52">検索でヒットさせる言い換え（例：おはこ）</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; font-weight: 700">このタグの曲（{{cur.count}}曲）</span>
          <div style="border: 1px solid #ECE6DA; border-radius: 12px">
            <sc-for list="{{curSongs}}" as="s" hint-placeholder-count="3">
              <div style="display: flex; justify-content: space-between; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #ECE6DA; font-size: 14px"><span>{{s.title}}</span><span style="color: #5E5A52; font-size: 13px">{{s.artist}}</span></div>
            </sc-for>
            <a href="Home.dc.html" style="display: block; padding: 10px 14px; font-size: 13px">セトリでこのタグを開く</a>
          </div>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px">
          <button style="height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: #2747A0; color: #FFFFFF; font-size: 14px; font-weight: 700">保存</button>
          <button style="height: 44px; padding: 0 16px; border: 1px solid #D9D2C3; border-radius: 12px; background: #FFFDF8; font-size: 14px; color: #1E1C18">別のタグに統合…</button>
          <button style="height: 44px; padding: 0 16px; border: 0; background: transparent; font-size: 14px; color: #A3341C">削除</button>
        </div>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { sel: '十八番' }; }
  renderVals() {
    const defs = [
      { name: '歌える度', kind: '基本タグ', tags: [['十八番',12],['歌える',41],['練習中',9]] },
      { name: 'ジャンル', kind: '基本タグ', tags: [['J-POP',38],['アニソン',17],['ボカロ',8]] },
      { name: 'マイタグ', kind: '自由に追加', tags: [['高音つらい',6],['原キーOK',14]] }
    ];
    let cur = null;
    const groups = defs.map((g) => ({ ...g, tags: g.tags.map(([l, c]) => {
      const on = this.state.sel === l;
      if (on) cur = { label: l, count: c, group: g.name };
      return { label: l, count: c, bg: on ? '#E6EAF5' : '#FFFDF8', weight: on ? 700 : 400, pick: () => this.setState({ sel: l }) };
    }) }));
    const curSongs = [
      { title: '夜に駆ける', artist: 'YOASOBI' },
      { title: 'マリーゴールド', artist: 'あいみょん' },
      { title: '[曲名]', artist: '[アーティスト]' }
    ];
    return { groups, cur: cur || { label: '', count: 0, group: '' }, curSongs };
  }
}
</script>
</body>
</html>
