name: Claude Code

# Issue・PR のコメントで「@claude」と書くと、Claude Code が動いて返答・実装・PR 作成をする。
# 指示の書き方や事前の設定は docs/operations.md の「Claude Code（GitHub Actions）」を参照。
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # 公開リポジトリなので、書き込み権限のある人（オーナー・コラボレーター）の「@claude」だけで動かす。
    # 第三者のコメントでジョブが走り、利用枠を消費しないようにする
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 同じ Issue・PR で続けて呼んだときは、前の実行が終わるのを待つ（同じブランチへの同時書き込みを避ける）
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # PR の CI 結果を Claude が読めるようにする
    services:
      # CI と同じ使い捨ての Postgres。RLS のテストを Claude にも通させる（Supabase 本番には向けない）
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # lint・typecheck・test を Claude が実行できるように、CI と同じ Node と依存を入れておく
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Pro / Max プランの OAuth トークン（`claude setup-token` で発行）。月額の範囲で動き、従量課金にならない。
          # API キー（従量課金）に切り替えるときは、この行を
          # `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}` に置き換える
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 方針は CLAUDE.md を自動で読む。ここでは次の3つを足す
          # - ターン上限：使いすぎ防止。30 ではふつうの実装でも足りず、作業を終えたのに失敗扱いになったので 60 にする
          # - 許可するコマンド：PR を出す前の確認（lint・typecheck・format・test）、バージョン上げ（release-bump）、
          #   Issue / PR の閲覧と PR の作成・本文の更新、git の読み取り
          # - 追加の指示：既定では「PR を作るリンク」を返すだけなので、Claude 自身に PR を作らせる
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(npm run lint),Bash(npm run typecheck),Bash(npm run format:check),Bash(npm run format),Bash(npm test),Bash(npm test *),Bash(npm run test:coverage),Bash(npx vitest *),Bash(npm version *),Bash(gh issue view *),Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr list *),Bash(gh pr create *),Bash(gh pr edit *),Bash(git status),Bash(git status *),Bash(git diff *),Bash(git log *),Bash(git show *),Bash(git branch *)"
            --append-system-prompt "このリポジトリでの追加の決まり：(1) Issue から起動してコードを変えたときは、push したあと、PR を作るリンクを返すのではなく、gh pr create --base main --head <作業ブランチ> --title <タイトル> --body <本文> で PR を自分で作り、コメントにはその PR の URL を書く。本文の書式は CLAUDE.md と release-bump スキルに従い、対応する Issue は必ず Closes #番号 と書く（Refs は使わない）。(2) Issue から起動したとき、その Issue を閉じる open な PR が既にあれば（gh pr list --state open --search で確かめる）、新しいブランチや PR は作らず、その PR の URL を示して、続きは PR のコメントで @claude と頼むよう案内して終える。(3) バージョンの上げ幅と更新履歴は release-bump スキルの手順で自分で決めてコミットし、オーナーの了承は待たない。"
